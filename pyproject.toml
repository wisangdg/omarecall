[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omarecall"
version = "0.3.0"
description = "Local, inspectable memory for AI agent sessions on Omarchy"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "wdg" }]
dependencies = []

[project.scripts]
omarecall = "omarecall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
